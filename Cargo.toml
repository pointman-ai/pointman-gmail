[package]
name = "gmail"
version = "0.2.0"
edition = "2021"
description = "Gmail on Pointman's nodes, for every agent, with any number of Google accounts signed in from the apps."
license = "MIT"
repository = "https://github.com/pointman-ai/pointman-gmail"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
# buffa's code for proto/gmail/v1/gmail.proto (build.rs) uses these: keep them at the SDK's versions
buffa = { version = "0.9.2", features = ["json"] }
getrandom = "0.2"
pointman-extension = { git = "https://github.com/pointman-ai/pointman-extension", tag = "v0.5.4" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
time = { version = "0.3", features = ["formatting", "parsing"] }
ureq = { version = "2", features = ["json"] }

[build-dependencies]
pointman-extension = { git = "https://github.com/pointman-ai/pointman-extension", tag = "v0.5.4", features = ["proto"] }

[dev-dependencies]
pointman-extension = { git = "https://github.com/pointman-ai/pointman-extension", tag = "v0.5.4", features = ["proto"] }
toml = "0.8"

[profile.release]
strip = true
lto = true
