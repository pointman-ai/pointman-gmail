# Gmail on Pointman: Gmail for every agent on the machines it's installed on, with any number of Google accounts. Each
# account is signed in from the apps (Google's authorization-code flow with PKCE, coming back by redirect: nothing to
# paste), and its refresh token is kept in the vault as gmail.<label>, so every node uses the same sign-ins. On a hosted
# Pointman the sign-in goes through Pointman's own Google client, core's shared client, and the code and refreshes go
# through core, so no client secret reaches the extension. A self-hosted Pointman uses a client of its own
# (gmail.client). Reads go to every account unless a call names one. Mail is sent when gmail.send is called (the yes
# before it is the workflow's or the task's).
#
# The commands' params and [settings] are written from proto/gmail/v1/gmail.proto (`<Verb>Params`, `Settings`) by
# the SDK's `pointman-extension manifest write`: change the proto, then write them again.

[extension]
id = "gmail"
name = "Gmail"
version = "0.2.0"
publisher = "aurelio"
summary = "Gmail for every agent: search and read mail, draft and send it, with any number of Google accounts."
node = ">=0.4.12"
platforms = ["macos-arm64", "macos-x86_64", "linux-x86_64", "linux-arm64"]

[run]
command = ["bin/gmail"]
runtime = "binary"

[behavior]
skill = "SKILL.md"
clients = ["claude", "codex", "gemini"]

[permissions]
network = true                   # Gmail's API, and Google's OAuth endpoints
secrets = ["gmail.*"]            # gmail.client (a self-hosted Pointman's OAuth client) and gmail.<label> (each account)

# Only for a self-hosted Pointman: a Google OAuth client of its own, a "Web application" client in a Google Cloud project
# with the Gmail API turned on, whose authorised redirect URI is that Pointman's /oauth/callback. A hosted Pointman
# signs in with its shared client, whose redirect is https://api.pointman.ai/v1/oauth/google/callback, and needs none.
# gcal can use the same client.
[[credentials]]
id = "client"
title = "Your Google OAuth client"
help = "Only for a self-hosted Pointman: a hosted one signs in with Pointman's own client. In Google Cloud console: Credentials › Create OAuth client ID › Web application, with redirect URI https://<your Pointman>/oauth/callback. Turn on the Gmail API. Paste its client ID, a space, then its secret."
needed = 0
item = "gmail.client"
value = '[0-9]+-[a-z0-9]+\.apps\.googleusercontent\.com[\s:]+[A-Za-z0-9_-]{16,128}'
placeholder = "123-abc.apps.googleusercontent.com GOCSPX-…"

# A Google account: Sign in from the apps, kept as its refresh token (`shared:` before it when Pointman's shared client
# signed it in, so its refreshes go through core). Any number, each with its own label.
[[credentials]]
id = "account"
title = "Google account"
help = "Sign in with the Google account and allow Gmail. Give each account its own label (work, personal)."
item = "gmail.{label}"
value = '(shared:)?1//[A-Za-z0-9_-]{20,512}'
placeholder = "1//0g…"
sign_in = true
shared_client = "google"

# From Settings in proto/gmail/v1/gmail.proto: `pointman-extension manifest write`
[settings]
type = "object"
description = "The extension's settings, per machine."
additionalProperties = false

[settings.properties.account]
type = "string"
description = "The label of the Google account a call uses when it names none (work, for the vault's gmail.work). Empty: the only one signed in; with several, reads use them all and writes stop and list them."
maxLength = 32
pattern = "^([a-z0-9][a-z0-9._-]*)?$"

[[commands]]
kind = "gmail.accounts"
title = "Google accounts and whether they work"
slash = "accounts"
summary = "Each Google account signed in: its label, its address, and whether its sign-in still works"

# From AccountsParams in proto/gmail/v1/gmail.proto: `pointman-extension manifest write`
[commands.params]
type = "object"
description = "gmail.accounts: each Google account signed in, its address, and whether its sign-in still works."
additionalProperties = false

[[commands]]
kind = "gmail.search"
title = "Search mail (query, account?, limit?)"
slash = "search"
summary = "Messages that match a Gmail search, newest first: who, subject, when; every account unless one is named"

# From SearchParams in proto/gmail/v1/gmail.proto: `pointman-extension manifest write`
[commands.params]
type = "object"
description = "gmail.search: messages that match a Gmail search, newest first."
required = ["query"]
additionalProperties = false

[commands.params.properties.query]
type = "string"
description = "Gmail's search, as its search box takes it: from:bob newer_than:7d, is:unread in:inbox, subject:invoice."
minLength = 1
maxLength = 1000

[commands.params.properties.account]
type = "string"
description = "The label of the Google account to search (work, for the vault's gmail.work). Empty: the account setting's, else every account signed in."
maxLength = 32
pattern = "^([a-z0-9][a-z0-9._-]*)?$"

[commands.params.properties.limit]
type = "integer"
description = "How many messages, newest first, from each account (default 10)."
default = 10
minimum = 1
maximum = 50

[[commands]]
kind = "gmail.read"
title = "Read a message (id, account?)"
slash = "read"
summary = "One message: its headers, its text and its attachments' names. Private: say what's there"

# From ReadParams in proto/gmail/v1/gmail.proto: `pointman-extension manifest write`
[commands.params]
type = "object"
description = "gmail.read: one message, with its text and the names of its attachments."
required = ["id"]
additionalProperties = false

[commands.params.properties.id]
type = "string"
description = "The message's id, from gmail.search."
minLength = 1
maxLength = 128
pattern = "^[A-Za-z0-9_-]+$"

[commands.params.properties.account]
type = "string"
description = "The label of the Google account it's in. Empty: the account setting's, else each account signed in until one has it."
maxLength = 32
pattern = "^([a-z0-9][a-z0-9._-]*)?$"

[[commands]]
kind = "gmail.draft"
title = "Draft a message (to, subject, body, reply_to?)"
slash = "draft"
summary = "A draft in Gmail, nothing sent; a reply goes in the message's thread"

# From DraftParams in proto/gmail/v1/gmail.proto: `pointman-extension manifest write`
[commands.params]
type = "object"
description = "gmail.draft: a draft in Gmail, nothing sent. A reply joins the message's thread."
required = ["body"]
additionalProperties = false

[commands.params.properties.to]
type = "array"
items = { type = "string", minLength = 3, maxLength = 320 }
description = "Who it's to: addresses, or Name <address>. Left out for a reply: the message's sender."
maxItems = 100

[commands.params.properties.cc]
type = "array"
items = { type = "string", minLength = 3, maxLength = 320 }
description = "Who's copied."
maxItems = 100

[commands.params.properties.subject]
type = "string"
description = "Its subject. Left out for a reply: Re: and the message's."
maxLength = 998

[commands.params.properties.body]
type = "string"
description = "Its text, as plain text."
minLength = 1
maxLength = 100000

[commands.params.properties.reply_to]
type = "string"
description = "The id of a message this answers (gmail.search's): the draft goes in its thread."
maxLength = 128
pattern = "^([A-Za-z0-9_-]+)?$"

[commands.params.properties.account]
type = "string"
description = "The label of the Google account it's from. Empty: the account setting's, or the only one signed in."
maxLength = 32
pattern = "^([a-z0-9][a-z0-9._-]*)?$"

[[commands]]
kind = "gmail.send"
title = "Send mail (draft, or to/subject/body)"
slash = "send"
summary = "Send a draft or a new message, at once: only what the task or workflow asked for"

# From SendParams in proto/gmail/v1/gmail.proto: `pointman-extension manifest write`
[commands.params]
type = "object"
description = "gmail.send: send a draft, or a new message. It goes at once: send only what the task or workflow asked for."
additionalProperties = false

[commands.params.properties.draft]
type = "string"
description = "A draft's id (gmail.draft's) to send as it is. Or leave it out and give to, subject and body."
maxLength = 128
pattern = "^([A-Za-z0-9_-]+)?$"

[commands.params.properties.to]
type = "array"
items = { type = "string", minLength = 3, maxLength = 320 }
description = "Who it's to: addresses, or Name <address>."
maxItems = 100

[commands.params.properties.cc]
type = "array"
items = { type = "string", minLength = 3, maxLength = 320 }
description = "Who's copied."
maxItems = 100

[commands.params.properties.subject]
type = "string"
maxLength = 998

[commands.params.properties.body]
type = "string"
description = "Its text, as plain text."
maxLength = 100000

[commands.params.properties.account]
type = "string"
description = "The label of the Google account it's from. Empty: the account setting's, or the only one signed in."
maxLength = 32
pattern = "^([a-z0-9][a-z0-9._-]*)?$"

[[commands]]
kind = "gmail.add"
title = "Add a Google account"
slash = "add"
form = "account"
summary = "Sign a Google account in for Gmail, on every node"

# From AddParams in proto/gmail/v1/gmail.proto: `pointman-extension manifest write`
[commands.params]
type = "object"
description = "gmail.add: a Google account's sign-in, added in the apps."
additionalProperties = false

[commands.params.properties.name]
type = "string"
description = "What to call it (work): lowercase letters, digits, . _ -"
maxLength = 32
pattern = "^([a-z0-9][a-z0-9._-]*)?$"

[[commands]]
kind = "gmail.client"
title = "Add your Google OAuth client"
slash = "client"
form = "client"
summary = "A self-hosted Pointman's own Google OAuth client: a Web application client in your Cloud project"

# From ClientParams in proto/gmail/v1/gmail.proto: `pointman-extension manifest write`
[commands.params]
type = "object"
description = "gmail.client: the Google OAuth client the sign-ins go through, added in the apps."
additionalProperties = false
